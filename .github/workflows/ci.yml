name: CI

on:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            pipeline:
              - 'pipelines/**'
      - if: steps.changes.outputs.pipeline == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.changes.outputs.pipeline == 'true'
        working-directory: pipelines
        run: uv run pytest
